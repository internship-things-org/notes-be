services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/daulyoi/backend:latest
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=${PORT}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    # NOTE: db/redis live in notes-infra/docker-compose.yml on the shared
    # external network "notes-network". Start infra first; cross-file
    # depends_on is not supported, so ordering is handled by startup order
    # + app-level retries.
    networks:
      - notes-network
    # healthcheck:
    #   test: ["CMD-SHELL", "node -e \"const {Pool}=require('pg');(async()=>{const p=new Pool({host:process.env.DB_HOST,port:process.env.DB_PORT,user:process.env.DB_USER,password:process.env.DB_PASSWORD,database:process.env.DB_NAME,connectionTimeoutMillis:2000});try{await p.query('SELECT 1');await p.end();process.exit(0)}catch(e){process.exit(1)}})()\""]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5
    #   start_period: 20s

networks:
  notes-network:
    name: notes-network
    external: true
